spring:
  application:
    name: GATEWAY-Service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # 0. Auth Service (Autenticación y Roles)
            - id: auth-service-route
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**
             # 5. Identity
            - id: identity-service-route
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/identity/**
            # 5. Order
            - id: order-service-route
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
            # 5. Payment
            - id: payment-service-route
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**
            # 5. Billing
            - id: billing-service-route
              uri: lb://billing-service
              predicates:
                - Path=/api/billing/**
                  # 5. Inventory Service
            - id: inventory-service-route
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
                # 6. Notification Service
            - id: notification-service-route
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
                  # 7. Shipping Service
            - id: shipping-service-route
              uri: lb://shipping-service
              predicates:
                - Path=/api/shipping/**
                # 8. Product Service (Catálogo y Productos)
            - id: product-service-route
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**


server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

